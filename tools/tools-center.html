<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubitos 工具中心</title>
    <link rel="stylesheet" href="../shared/sidebar.css" />
    <style>
      :root {
        --text: #241b1a;
        --muted: #7b6a66;
        --brand: #d92d20;
        --line: rgba(236, 214, 209, 0.92);
        --card: rgba(255, 255, 255, 0.96);
        --shadow: 0 28px 60px rgba(118, 39, 27, 0.12);
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", "Inter", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(217, 45, 32, 0.14), transparent 28%),
          radial-gradient(circle at bottom right, rgba(166, 27, 19, 0.16), transparent 26%),
          #160f0f;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      .desktop-stage {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .app-window {
        width: min(1728px, calc(100vw - 32px));
        height: auto;
        min-height: 720px;
        display: grid;
        grid-template-columns: var(--hubitos-sidebar-width) minmax(0, 1fr);
        overflow: visible;
        border-radius: 28px;
        background: linear-gradient(180deg, #fff9f8 0%, #fffdfc 100%);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .tools-shell {
        min-width: 0;
        min-height: 100%;
        display: grid;
        grid-template-rows: 72px auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 24px;
        border-bottom: 1px solid rgba(235, 209, 204, 0.42);
        background:
          radial-gradient(circle at 18% 0%, rgba(217, 45, 32, 0.08), transparent 22%),
          rgba(255, 252, 251, 0.86);
      }

      .topbar-left,
      .topbar-right,
      .market-tabs,
      .toolbar,
      .category-tabs,
      .card-footer {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .market-tabs {
        gap: 28px;
      }

      .market-tab {
        position: relative;
        min-height: 72px;
        display: inline-flex;
        align-items: center;
        background: transparent;
        color: #9c8885;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
      }

      .market-tab.active {
        color: var(--brand);
      }

      .market-tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        border-radius: 999px;
        background: var(--brand);
      }

      .search-shell {
        position: relative;
      }

      .search-shell input {
        width: 320px;
        height: 40px;
        padding: 0 18px 0 44px;
        border: 1px solid rgba(238, 220, 217, 0.95);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: #352523;
        outline: none;
      }

      .search-shell .icon {
        position: absolute;
        left: 16px;
        top: 10px;
        color: #a18d89;
        font-size: 15px;
      }

      .primary-btn,
      .filter-chip,
      .action-btn {
        min-height: 38px;
        padding: 0 18px;
        border-radius: 999px;
        cursor: pointer;
      }

      .primary-btn {
        color: #fff;
        background: linear-gradient(180deg, #d92d20 0%, #bb180e 100%);
        box-shadow: 0 12px 20px rgba(217, 45, 32, 0.18);
      }

      .action-btn,
      .filter-chip {
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(236, 214, 209, 0.92);
        color: #6f5f5c;
        font-weight: 700;
        transition: all 0.18s ease;
      }

      .avatar-btn,
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: transparent;
        color: #604945;
        cursor: pointer;
      }

      .avatar-btn {
        background: linear-gradient(180deg, #fbe1dd 0%, #f5c4bb 100%);
      }

      .tools-main {
        min-width: 0;
        min-height: auto;
        padding: 20px 24px 22px;
        overflow: visible;
        scrollbar-width: thin;
        scrollbar-color: #e5bdb7 transparent;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .tools-main::-webkit-scrollbar { width: 6px; }
      .tools-main::-webkit-scrollbar-track { background: transparent; }
      .tools-main::-webkit-scrollbar-thumb { background: #e5bdb7; border-radius: 999px; }

      .toolbar {
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .category-tabs {
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .category-tabs .filter-chip.active {
        background: #a6c93f !important;
        color: #111111 !important;
        border-color: #a6c93f !important;
        box-shadow: 0 6px 16px rgba(166, 201, 63, 0.22) !important;
      }

      .tools-grid {
        display: grid;
        grid-template-columns: repeat(4, 300px);
        gap: 16px;
        align-content: start;
        align-items: start;
        grid-auto-rows: minmax(220px, auto);
        width: 100%;
        justify-content: start;
      }

      .tool-card {
        padding: 18px;
        border-radius: 24px;
        border: 1px solid rgba(236, 214, 209, 0.9);
        background: var(--card);
        box-shadow: 0 18px 32px rgba(145, 54, 39, 0.08);
        display: grid;
        gap: 14px;
        min-height: 240px;
        align-content: start;
        cursor: pointer;
        width: 100%;
        text-align: left;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      }

      .tool-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 36px rgba(145, 54, 39, 0.12);
        border-color: rgba(217, 45, 32, 0.28);
      }

      .tool-card:focus-visible {
        outline: 2px solid rgba(217, 45, 32, 0.7);
        outline-offset: 2px;
      }

      .tool-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .tool-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #fff1ef 0%, #f8e0dc 100%);
        color: var(--brand);
        font-size: 18px;
      }

      .tool-type {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        background: #f4ecea;
        color: #755e59;
        font-size: 11px;
        font-weight: 700;
      }

      .tool-card h3 {
        margin: 0;
        font-size: 18px;
      }

      .tool-card p {
        margin: 0;
        color: var(--muted);
        min-height: 70px;
      }

      .tool-tag {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #f7f2f1;
        color: #715f5b;
        font-size: 12px;
        font-weight: 700;
      }

      .card-footer {
        justify-content: space-between;
        gap: 12px;
        min-height: 1px;
      }

      .card-meta {
        color: #8e7773;
        font-size: 12px;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        min-width: 220px;
        max-width: 420px;
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(31, 22, 22, 0.9);
        color: #fff;
        font-size: 13px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .toast.show { opacity: 1; }

      @media (max-width: 1480px) {
        .tools-grid {
          grid-template-columns: repeat(3, 300px);
        }
      }

      @media (max-width: 1280px) {
        body { padding: 0; }
        .app-window {
          width: 100vw;
          height: 100vh;
          min-height: 100vh;
          border-radius: 0;
        }
        .tools-grid {
          grid-template-columns: repeat(2, 300px);
        }
      }

      @media (max-width: 760px) {
        .tools-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="../shared/theme-dark.css" />
  </head>
  <body>
    <div class="desktop-stage">
      <main class="app-window">
        <div id="sharedSidebar"></div>

        <section class="tools-shell">
          <header class="topbar">
            <div class="topbar-left">
              <div class="market-tabs" id="scopeTabs">
                <button class="market-tab active" data-scope="mine" type="button">我的智能体</button>
                <button class="market-tab" data-scope="all" type="button">全部智能体</button>
              </div>
            </div>
            <div class="topbar-right">
              <div class="search-shell">
                <span class="icon">⌕</span>
                <input id="searchInput" type="text" placeholder="搜索智能体、技能、MCP 或标签..." />
              </div>
              <button class="icon-btn" type="button">◌</button>
            </div>
          </header>

          <main class="tools-main">
            <section class="toolbar">
              <div class="category-tabs" id="tagTabs"></div>
            </section>

            <section class="tools-grid" id="toolsGrid"></section>
          </main>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script>
      const toolsLang = (() => {
        try {
          const url = new URL(window.location.href);
          const queryLang = url.searchParams.get("lang");
          if (queryLang === "zh" || queryLang === "en") return queryLang;
          const stored = window.localStorage.getItem("hubitos-language");
          return stored === "zh" ? "zh" : "en";
        } catch (error) {
          return "en";
        }
      })();
      const isToolsEnglish = toolsLang === "en";
      const tt = (zh, en) => (isToolsEnglish ? en : zh);

      window.HubitosSidebar.mount("#sharedSidebar", {

        workflowsHref: "../workflows/workflows-home.html",
        projectsHref: "../projects/projects-center.html",
        filesHref: "../files/files-center.html",
        agentsHref: "../agents/agents-center.html",
        skillsHref: "../skills/skills-center.html",

      const state = {

          {
            id: "agent-market-research",

            tags: [tt("调研分析", "Research & Analysis")],
            icon: "▣",
            invokeText: tt(
              "请使用《竞品分析 Skill》分析以下对象，并严格按 Skill 的结构输出 HTML 级别的结构化竞品分析结果。\n竞品名称：扣子 Coze\n竞品官网 / 产品链接：https://www.coze.cn/\n所属行业：AI Agent / AI 办公平台\n目标市场：中文市场\n目标用户：个人办公用户、内容创作者、开发者、企业团队\n关注维度：产品定位、目标用户、核心功能、用户路径、商业模式、定价策略、增长获客、竞争优势、短板风险、我方机会点\n是否需要对标其他竞品：否\n输出格式要求：结构化 HTML 页面\n是否需要给出我方机会点：是",

            tags: [tt("调研分析", "Research & Analysis")],

          {

          {

            tags: [tt("客服支持", "Customer Support")],
            icon: "☏",
            invokeText: tt("请调用工单分流助手，帮我把用户问题按类型分类并分配处理。", "Invoke the Ticket Routing Assistant to classify user issues by type and route them for handling.")
          },
          {
            id: "skill-reply-polish",
            type: tt("技能", "Skill"),
            scope: "mine",
            title: tt("客服回复润色", "Support Reply Polisher"),
            desc: tt("把原始回复改得更清楚、更礼貌，也更符合品牌语气。", "Polish raw replies to make them clearer, more polite, and more aligned with brand tone."),
            tags: [tt("客服支持", "Customer Support")],
            icon: "✉",
            invokeText: tt("请调用客服回复润色，帮我把这段客服回复改得更清楚、更礼貌。", "Invoke Support Reply Polisher to make this support reply clearer and more polite.")
          }
        ]
      };

      const ACTIVE_TOOL_KEY = "hubitos-active-tool";

      const refs = {
        scopeTabs: document.getElementById("scopeTabs"),
        searchInput: document.getElementById("searchInput"),
        tagTabs: document.getElementById("tagTabs"),
        toolsGrid: document.getElementById("toolsGrid"),
        toast: document.getElementById("toast")
      };

      const tagOptions = [
        { key: "all", label: tt("全部", "All") },
        { key: tt("内容写作", "Content Writing"), label: tt("内容写作", "Content Writing") },
        { key: tt("调研分析", "Research & Analysis"), label: tt("调研分析", "Research & Analysis") },
        { key: tt("编程开发", "Coding & Development"), label: tt("编程开发", "Coding & Development") },
        { key: tt("设计体验", "Design & UX"), label: tt("设计体验", "Design & UX") },
        { key: tt("自动化运营", "Automation & Operations"), label: tt("自动化运营", "Automation & Operations") },
        { key: tt("客服支持", "Customer Support"), label: tt("客服支持", "Customer Support") }
      ];

      document.title = tt("Hubitos 工具中心", "Hubitos Tools Center");
      document.querySelector('[data-scope="mine"]').textContent = tt("我的智能体", "My Agents");
      document.querySelector('[data-scope="all"]').textContent = tt("全部智能体", "All Agents");
      document.getElementById("searchInput").placeholder = tt("搜索智能体、技能、MCP 或标签...", "Search agents, skills, MCPs, or tags...");

      function showToast(text) {
        refs.toast.textContent = text;
        refs.toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => refs.toast.classList.remove("show"), 1800);
      }

      function filteredTools() {
        return state.tools.filter((tool) => {
          const matchesScope = state.scope === "all" || tool.scope === "mine";
          const matchesTag = state.tag === "all" || tool.tags.includes(state.tag);
          const text = `${tool.title} ${tool.desc} ${tool.tags.join(" ")}`.toLowerCase();
          const matchesSearch = text.includes(state.search.toLowerCase());
          return matchesScope && matchesTag && matchesSearch;
        });
      }

      function renderTags() {
        refs.tagTabs.innerHTML = tagOptions
          .map(
            (tag) => `
              <button class="filter-chip ${state.tag === tag.key ? "active" : ""}" data-tag="${tag.key}" type="button">
                ${tag.label}
              </button>
            `
          )
          .join("");
      }

      function renderTools() {
        const tools = filteredTools();
        refs.toolsGrid.innerHTML = tools
          .map(
            (tool) => `
              <button class="tool-card" data-tool-id="${tool.id}" type="button">
                <div class="tool-header">
                  <div class="tool-icon">${tool.icon}</div>
                </div>
                <div>
                  <h3>${tool.title}</h3>
                  <p>${tool.desc}</p>
                </div>
                <div class="card-footer">
                </div>
              </button>
            `
          )
          .join("");

        if (!tools.length) {
          refs.toolsGrid.innerHTML = `
            <article class="tool-card" style="grid-column: 1 / -1;">
              <h3>${tt("没有找到内容", "No Results Found")}</h3>
              <p>${tt("换个分类或关键词试试。", "Try a different category or keyword.")}</p>
            </article>
          `;
        }
      }

      function render() {
        renderTags();
        renderTools();
      }

      refs.scopeTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-scope]");
        if (!button) return;
        state.scope = button.dataset.scope;
        refs.scopeTabs.querySelectorAll("[data-scope]").forEach((item) => item.classList.toggle("active", item.dataset.scope === state.scope));
        renderTools();
      });

      refs.tagTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-tag]");
        if (!button) return;
        state.tag = button.dataset.tag;
        render();
      });

      refs.searchInput.addEventListener("input", (event) => {
        state.search = event.target.value;
        renderTools();
      });

      refs.toolsGrid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-tool-id]");
        if (!card) return;
        const tool = state.tools.find((item) => item.id === card.dataset.toolId);
        if (!tool) return;
        if (tool.href) {
          showToast(`正在打开 ${tool.title}...`);
          setTimeout(() => {
            window.location.href = tool.href;
          }, 220);
          return;
        }
        window.localStorage.setItem(
          ACTIVE_TOOL_KEY,
          JSON.stringify({
            id: tool.id,
            type: tool.type,
            title: tool.title,
            desc: tool.desc,
            icon: tool.icon,
            invokeText: tool.invokeText,
            tags: tool.tags
          })
        );
        showToast(`正在用 ${tool.title} 打开对话...`);
        setTimeout(() => {
          window.location.href = "../chat/chat-workspace.html";
        }, 220);
      });

      render();
    </script>
  </body>
</html>
