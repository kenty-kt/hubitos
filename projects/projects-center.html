<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubitos 项目中心</title>
    <link rel="stylesheet" href="../shared/sidebar.css" />
    <link rel="stylesheet" href="./projects-center.css" />
    <link rel="stylesheet" href="../shared/theme-dark.css" />
  </head>
  <body>
    <div class="desktop-stage">
      <main class="app-window">
        <div id="sharedSidebar"></div>

        <section class="projects-shell">
          <header class="topbar">
            <div class="topbar-left">
              <div class="market-tabs" id="statusTabs"></div>
            </div>
            <div class="topbar-right">
              <div class="search-shell search-shell-topbar">
                <span>⌕</span>
                <input id="searchInput" type="text" placeholder="搜索项目名、仓库名或技术栈..." />
              </div>
            </div>
          </header>

          <div class="projects-content split">
            <section class="panel glass">
              <div class="panel-head">
                <div>
                  <div class="panel-kicker">项目列表</div>
                  <h2>项目</h2>
                </div>
              </div>
              <div class="project-list" id="projectList"></div>
            </section>

            <aside class="panel hero-panel">
              <div class="panel-kicker">当前选中</div>
              <h2 id="previewTitle">hubitos-client-shell</h2>
              <p id="previewSummary" class="hero-copy"></p>
              <div class="preview-grid">
                <div class="metric-card">
                  <span>仓库</span>
                  <strong id="previewRepo"></strong>
                </div>
                <div class="metric-card">
                  <span>技术栈</span>
                  <strong id="previewFramework"></strong>
                </div>
                <div class="metric-card">
                  <span>状态</span>
                  <strong id="previewStatus"></strong>
                </div>
                <div class="metric-card">
                  <span>上次启动</span>
                  <strong id="previewUpdatedAt"></strong>
                </div>
                <div class="metric-card">
                  <span>本地地址</span>
                  <strong id="previewUrl"></strong>
                </div>
                <div class="metric-card">
                  <span>自动修复方式</span>
                  <strong id="previewRepair"></strong>
                </div>
              </div>
              <div class="hero-actions">
                <button class="primary-btn" id="openDetailBtn" type="button">查看详情</button>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="importModal">
      <div class="modal-card">
        <div class="panel-head compact">
          <div>
            <div class="panel-kicker">Import GitHub Repository</div>
            <h3>Add a project to this channel</h3>
          </div>
          <button class="ghost-btn small" id="closeModalBtn" type="button">Close</button>
        </div>
        <div class="form-grid">
          <label>
            <span>Repository</span>
            <input id="repoInput" type="text" placeholder="kenty-kt/hubitos-app" />
          </label>
          <label>
            <span>Framework</span>
            <select id="frameworkInput">
              <option>Next.js</option>
              <option>Vite</option>
              <option>Node API</option>
              <option>Python</option>
              <option>Docker</option>
            </select>
          </label>
          <label>
            <span>Branch</span>
            <input id="branchInput" type="text" placeholder="main" value="main" />
          </label>
          <label>
            <span>Local port</span>
            <input id="portInput" type="number" placeholder="3000" value="3000" />
          </label>
        </div>
        <div class="modal-actions">
          <button class="ghost-btn" id="seedDemoBtn" type="button">填入示例</button>
          <button class="primary-btn" id="saveProjectBtn" type="button">Save project</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script src="./projects-store.js"></script>
    <script>
      window.HubitosSidebar.mount("#sharedSidebar", {
        active: "projects",
        showHistory: true,
        historyTitle: "Recent Repos",
        historyContainerId: "historyList",
        primaryLabel: "+ Import Repo",
        primaryId: "sidebarImportBtn",
        chatHref: "../chat/chat-workspace.html",
        toolsHref: "../tools/tools-center.html",
        projectsHref: "./projects-center.html",
        filesHref: "../files/files-center.html",
        agentsHref: "../agents/agents-center.html",
        skillsHref: "../skills/skills-center.html",
        mcpHref: "../mcp/mcp-center.html"
      });
    </script>
    <script src="./projects-center.js"></script>
  </body>
</html>
