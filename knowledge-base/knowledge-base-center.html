<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubitos AI OS - 频道知识库</title>
    <link rel="stylesheet" href="../shared/sidebar.css" />
    <link rel="stylesheet" href="../shared/theme-dark.css" />
    <style>
      :root {
        --bg: #f4f7fb;
        --paper: #ffffff;
        --paper-soft: #f8fbff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #dbe4ee;
        --line-strong: #c7d3df;
        --accent: #0f766e;
        --accent-soft: rgba(240, 253, 250, 0.96);
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.08), transparent 24%),
          radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.08), transparent 22%),
          var(--bg);
      }

      body {
        padding: 16px;
      }

      .workspace {
        width: min(1760px, calc(100vw - 32px));
        min-height: calc(100vh - 32px);
        margin: 0 auto;
        border-radius: 30px;
        overflow: clip;
        background: linear-gradient(180deg, #fbfdff 0%, #ffffff 100%);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      .shell {
        margin-left: var(--hubitos-sidebar-width);
        width: calc(100% - var(--hubitos-sidebar-width));
        min-height: calc(100vh - 32px);
        display: grid;
        grid-template-columns: 80px 360px minmax(0, 1fr);
        background: linear-gradient(180deg, #fdfefe 0%, #f8fbff 100%);
      }

      .shell.nav-collapsed {
        grid-template-columns: 80px 0 minmax(0, 1fr);
      }

      .micro-rail {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, #f8fbff 0%, #f1f6fb 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 22px 10px;
      }

      .rail-logo {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(180deg, #0f766e, #0b5f59);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 800;
      }

      .rail-spacer {
        flex: 1;
      }

      .rail-toggle {
        margin-top: 4px;
      }

      .rail-icon {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        border: 1px solid transparent;
        background: transparent;
        color: #64748b;
        display: grid;
        place-items: center;
        font-size: 21px;
      }

      .rail-icon.active {
        background: #ffffff;
        border-color: var(--line);
        color: var(--ink);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }

      .knowledge-nav {
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        min-width: 0;
        overflow: hidden;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .shell.nav-collapsed .knowledge-nav {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-8px);
      }

      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 24px 24px 18px;
        border-bottom: 1px solid var(--line);
      }

      .pane-head h1,
      .content-head h2,
      .section-title {
        margin: 0;
        letter-spacing: -0.04em;
      }

      .pane-head h1 {
        font-size: 26px;
      }

      .pane-tools {
        display: flex;
        gap: 10px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        display: grid;
        place-items: center;
        font-size: 18px;
      }

      .tree-row[data-drop-folder] {
        cursor: pointer;
      }

      .tree-row.is-drop-target {
        background: #eef6f4;
        box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.18);
      }

      .search-box {
        position: relative;
        padding: 16px 20px 0;
      }

      .search-box input {
        width: 100%;
        height: 46px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 0 16px 0 46px;
        font: inherit;
        outline: none;
      }

      .search-icon {
        position: absolute;
        left: 34px;
        top: 28px;
        color: #94a3b8;
        font-size: 18px;
      }

      .tree-wrap {
        overflow: auto;
        padding: 16px 12px 22px 16px;
      }

      .tree {
        display: grid;
        gap: 10px;
      }

      .tree-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 14px;
        color: #475569;
      }

      .tree-row.active {
        background: #eef6f4;
        color: #0f172a;
        box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.12);
      }

      .tree-label {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .tree-icon {
        width: 22px;
        text-align: center;
        color: #64748b;
      }

      .tree-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .tree-depth-1 { padding-left: 24px; }
      .tree-depth-2 { padding-left: 42px; }
      .tree-depth-3 { padding-left: 60px; }

      .tree-count {
        min-width: 30px;
        height: 28px;
        padding: 0 9px;
        border-radius: 999px;
        background: #f1f5f9;
        color: #475569;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
      }

      .content-pane {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-width: 0;
      }

      .content-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px 24px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.76);
      }

      .content-head h2 {
        font-size: 24px;
      }

      .content-head-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .back-btn {
        min-height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font: inherit;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .content-body {
        display: grid;
        gap: 22px;
        padding: 22px;
        overflow: auto;
        min-width: 0;
        align-content: start;
      }

      .folder-section,
      .files-section {
        display: grid;
        gap: 14px;
      }

      .files-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .view-toggle {
        display: flex;
        gap: 8px;
      }

      .view-toggle-btn {
        min-height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid #dbe4ee;
        background: #fff;
        color: var(--muted);
        font: inherit;
      }

      .view-toggle-btn.active {
        border-color: rgba(15, 118, 110, 0.2);
        background: #eef6f4;
        color: var(--ink);
      }

      .section-title {
        font-size: 22px;
      }

      .folder-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .folder-card {
        display: grid;
        gap: 10px;
        padding: 18px 16px;
        border-radius: 18px;
        border: 1px solid #dbe4ee;
        background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.05);
        cursor: pointer;
      }

      .folder-card strong {
        display: block;
        font-size: 15px;
      }

      .folder-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .table {
        border-radius: 18px;
        border: 1px solid #dbe4ee;
        overflow: hidden;
        background: rgba(255,255,255,.92);
      }

      .file-card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .file-card {
        display: grid;
        gap: 12px;
        padding: 16px;
        border-radius: 18px;
        border: 1px solid #dbe4ee;
        background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.05);
        cursor: pointer;
      }

      .file-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .file-card-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .file-card-title span:last-child {
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .file-card-meta {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .table-head,
      .table-row {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(220px, 0.9fr) 72px;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
      }

      .table-head {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        border-bottom: 1px solid var(--line);
        background: #f8fbff;
      }

      .table-row {
        border-bottom: 1px solid #eef3f8;
        cursor: pointer;
      }

      .table-row.dragging {
        opacity: 0.45;
      }

      .table-row:last-child {
        border-bottom: 0;
      }

      .file-name {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .file-name span:last-child,
      .person span:last-child {
        overflow-wrap: anywhere;
      }

      .file-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #eef4fb;
        color: #3b82f6;
        display: grid;
        place-items: center;
        font-size: 15px;
      }

      .person {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%);
        color: #1d4ed8;
        display: grid;
        place-items: center;
        font-weight: 700;
        flex: 0 0 auto;
      }

      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .row-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #dc2626;
        font-size: 16px;
      }

      .doc-view {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) 360px;
        border: 1px solid #dbe4ee;
        border-radius: 24px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.05);
      }

      .doc-main {
        min-width: 0;
        display: grid;
        border-right: 1px solid #e5edf5;
        background: #ffffff;
      }

      .note-tab {
        min-height: 34px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid #dbe4ee;
        background: #fff;
        color: var(--ink);
        font: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .note-tab.active {
        border-color: rgba(15, 118, 110, 0.2);
        background: #eef6f4;
      }

      .doc-sheet {
        padding: 26px 28px 32px;
        overflow: auto;
      }

      .doc-sheet h3 {
        margin: 0 0 22px;
        font-size: 22px;
      }

      .doc-sheet p {
        margin: 0 0 26px;
        color: #334155;
        font-size: 15px;
        line-height: 1.9;
        white-space: pre-wrap;
      }

      .doc-side {
        min-width: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        background: #fbfdff;
      }

      .doc-side-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid #e5edf5;
      }

      .doc-note-tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .doc-tab-panel {
        display: none;
        min-height: 0;
      }

      .doc-tab-panel.active {
        display: grid;
      }

      .doc-note-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid #e5edf5;
      }

      .note-search-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #64748b;
      }

      .add-note-btn {
        min-height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        border: 0;
        background: #0f172a;
        color: #fff;
        font: inherit;
      }

      .note-list {
        display: grid;
        gap: 12px;
        padding: 16px;
        overflow: auto;
      }

      .chat-panel {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 0;
      }

      .chat-list {
        display: grid;
        gap: 12px;
        padding: 16px;
        overflow: auto;
      }

      .chat-bubble {
        padding: 14px 16px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      }

      .chat-bubble.user {
        background: #eef6f4;
        border-color: rgba(15, 118, 110, 0.14);
      }

      .chat-bubble strong {
        display: block;
        font-size: 13px;
      }

      .chat-bubble p {
        margin: 8px 0 0;
        color: #475569;
        line-height: 1.6;
      }

      .chat-compose {
        display: grid;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid #e5edf5;
        background: #fff;
      }

      .chat-compose textarea {
        width: 100%;
        min-height: 92px;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid #dbe4ee;
        background: #fff;
        color: var(--ink);
        font: inherit;
        resize: vertical;
        outline: none;
      }

      .chat-compose-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .chat-link-action {
        border: 0;
        background: transparent;
        color: #7c3aed;
        font: inherit;
        padding: 0;
        cursor: pointer;
      }

      .chat-send-wrap {
        display: flex;
        justify-content: flex-end;
      }

      .note-card {
        padding: 16px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        background: #fff;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      }

      .note-card strong {
        display: block;
        font-size: 14px;
      }

      .note-card p {
        margin: 10px 0 0;
        color: #64748b;
        line-height: 1.6;
      }

      .note-time {
        display: block;
        margin-top: 14px;
        color: #94a3b8;
        font-size: 12px;
      }

      @media (max-width: 1480px) {
        .shell {
          grid-template-columns: 72px 300px minmax(0, 1fr);
        }

        .folder-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .file-card-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .doc-view {
          grid-template-columns: 1fr;
        }

        .doc-main {
          border-right: 0;
          border-bottom: 1px solid #e5edf5;
        }
      }

      @media (max-width: 1200px) {
        body {
          padding: 0;
        }

        .workspace {
          width: 100vw;
          min-height: 100vh;
          border-radius: 0;
        }

        .shell {
          grid-template-columns: 76px 320px minmax(0, 1fr);
        }

        .content-body,
        .content-head,
        .pane-head {
          padding-left: 20px;
          padding-right: 20px;
        }

        .folder-grid {
          grid-template-columns: 1fr;
        }

        .file-card-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="workspace">
      <div id="sharedSidebar"></div>

      <main class="shell">
        <aside class="micro-rail">
          <div class="rail-logo">◈</div>
          <button class="rail-icon rail-toggle" id="expandNavBtn" type="button">◫</button>
          <button class="rail-icon" type="button">⌂</button>
          <button class="rail-icon active" type="button">⛁</button>
          <button class="rail-icon" type="button">⇄</button>
          <button class="rail-icon" type="button">▥</button>
          <div class="rail-spacer"></div>
        </aside>

        <section class="knowledge-nav">
          <div class="pane-head">
            <h1>Knowledge Base</h1>
            <div class="pane-tools">
              <button class="icon-btn" type="button">＋</button>
              <button class="icon-btn" id="collapseNavBtn" type="button">◫</button>
            </div>
          </div>

          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Search..." />
          </div>

          <div class="tree-wrap">
            <div class="tree">
              <div class="tree-row" data-drop-folder="all">
                <div class="tree-label">
                  <span class="tree-icon">🗂</span>
                  <span class="tree-title">All</span>
                </div>
              </div>
              <div class="tree-row active" data-drop-folder="general">
                <div class="tree-label">
                  <span class="tree-icon">🗀</span>
                  <span class="tree-title">General Knowledge</span>
                </div>
                <span class="tree-count">10</span>
              </div>
              <div class="tree-row tree-depth-1" data-drop-folder="onboarding">
                <div class="tree-label">
                  <span class="tree-icon">🗀</span>
                  <span class="tree-title">Onboarding</span>
                </div>
                <span class="tree-count">3</span>
              </div>
              <div class="tree-row tree-depth-2">
                <div class="tree-label" data-open-folder="subfolder-1">
                  <span class="tree-icon">🗁</span>
                  <span class="tree-title">Subfolder 1</span>
                </div>
                <span class="tree-count">5</span>
              </div>
              <div class="tree-row tree-depth-2">
                <div class="tree-label" data-open-folder="subfolder-2">
                  <span class="tree-icon">🗁</span>
                  <span class="tree-title">Subfolder 2</span>
                </div>
                <span class="tree-count">10</span>
              </div>
              <div class="tree-row tree-depth-1" data-drop-folder="integrations">
                <div class="tree-label">
                  <span class="tree-icon">🗀</span>
                  <span class="tree-title">Integrations</span>
                </div>
              </div>
              <div class="tree-row tree-depth-1" data-drop-folder="documents">
                <div class="tree-label">
                  <span class="tree-icon">🗀</span>
                  <span class="tree-title">Documents</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="content-pane">
          <div class="content-head">
            <div class="content-head-left">
              <button class="back-btn" id="backButton" type="button" style="display:none;">← 返回</button>
              <h2 id="contentTitle">General Knowledge</h2>
            </div>
            <button class="btn-secondary" type="button">切换知识库</button>
          </div>

          <div class="content-body" id="contentBody">
            <section class="files-section" id="filesSection">
              <div class="table" id="filesTable">
                <div class="table-head" id="filesTableHead">
                  <div>Name</div>
                  <div>Workflow / Agent</div>
                  <div>操作</div>
                </div>
                <div id="fileRows"></div>
              </div>
            </section>

            <section id="detailSection" style="display:none;"></section>
          </div>
        </section>
      </main>
    </div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script>
      window.HubitosSidebar.mount("#sharedSidebar", {
        active: "knowledge-base",
        fixed: true,
        showHistory: true,
        historyTitle: "最近对话",
        primaryLabel: "+ 新建知识库",
        primaryId: "newKnowledgeBaseBtn",
        chatHref: "../chat/chat-workspace.html",
        toolsHref: "../tools/tools-center.html",
        workflowsHref: "../workflows/workflows-home.html",
        projectsHref: "../projects/projects-center.html",
        knowledgeBaseHref: "./knowledge-base-center.html",
        filesHref: "../files/files-center.html",
        agentsHref: "../agents/agents-center.html",
        skillsHref: "../skills/skills-center.html",
        mcpHref: "../mcp/mcp-center.html"
      });

      const fileDetails = {

      function getFilesByFolder(folderId) {
        if (folderId === "all") return Object.keys(fileDetails);
        return Object.entries(fileDetails)
          .filter(([, file]) => file.folder === folderId || (folderId === "general" && !file.folder))
          .map(([id]) => id);
      }

      function renderFileRows(ids) {
        if (activeFileView === "grid") {
          filesTableHead.style.display = "none";
          fileRows.innerHTML = `
            <div class="file-card-grid">
              ${ids
                .map((id) => {
                  const detail = fileDetails[id];
                  return `
                    <article class="file-card" data-open-file="${id}" draggable="true">
                      <div class="file-card-top">
                        <div class="file-card-title">
                          <span class="file-icon">▤</span>
                          <span>${detail.title}</span>
                        </div>
                        <span class="status">${detail.status}</span>
                      </div>
                      <div class="file-card-meta">
                        <span>来源：${detail.workflow}</span>
                        <span>${detail.meta[2] || ""}</span>
                      </div>
                      <div>
                        <button class="row-action" type="button" data-delete-file="${id}" aria-label="删除文件">🗑</button>
                      </div>
                    </article>
                  `;
                })
                .join("")}
            </div>
          `;
          bindFileRowEvents();
          return;
        }

        filesTableHead.style.display = "grid";
        fileRows.innerHTML = ids
          .map((id) => {
            const detail = fileDetails[id];
            return `
              <div class="table-row" data-open-file="${id}" draggable="true">
                <div class="file-name">
                  <span class="file-icon">▤</span>
                  <span>${detail.title}</span>
                </div>
                <div class="person">
                  <span class="avatar">${detail.workflow.charAt(0)}</span>
                  <span>${detail.workflow}</span>
                </div>
                <div><button class="row-action" type="button" data-delete-file="${id}" aria-label="删除文件">🗑</button></div>
              </div>
            `;
          })
          .join("");
        bindFileRowEvents();
      }

      function renderFolderFiles(folderId) {
        activeFolderId = folderId;
        const titleMap = {
          all: "All Files",
          general: "General Knowledge / Files",
          onboarding: "Onboarding / Files",
          "subfolder-1": "Subfolder 1 / Files",
          "subfolder-2": "Subfolder 2 / Files",

        filesSection.style.display = "";
        detailSection.style.display = "none";
        detailSection.innerHTML = "";
        backButton.style.display = "inline-flex";
        renderFileRows(getFilesByFolder(folderId));
      }

      function renderFileDetail(detail) {
        contentTitle.textContent = detail.title;
        filesSection.style.display = "none";
        detailSection.style.display = "block";
        backButton.style.display = "inline-flex";

      function resetView() {
        contentTitle.textContent = "General Knowledge";
        filesSection.style.display = "";
        activeFolderId = "all";
        renderFileRows(["user-interviews", "onboarding-guide", "roadmap", "faq-notes", "brand-voice"]);
        detailSection.style.display = "none";
        detailSection.innerHTML = "";
        backButton.style.display = "none";
      }

      function bindFileRowEvents() {
        document.querySelectorAll("[data-open-file]").forEach((item) => {
          item.ondragstart = (event) => {
            item.classList.add("dragging");
            event.dataTransfer.setData("text/plain", item.dataset.openFile);
          };
          item.ondragend = () => {
            item.classList.remove("dragging");
          };
          item.onclick = (event) => {
            if (event.target.closest("[data-delete-file]")) return;
            activeFileId = item.dataset.openFile;
            renderFileDetail(fileDetails[item.dataset.openFile]);
          };
        });
        document.querySelectorAll("[data-delete-file]").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            const fileId = button.dataset.deleteFile;
            const detail = fileDetails[fileId];
            if (!detail) return;
            const confirmed = window.confirm(`确认删除文件 “${detail.title}” 吗？`);
            if (!confirmed) return;
            delete fileDetails[fileId];
            if (activeFileId === fileId) activeFileId = null;
            renderFileRows(getFilesByFolder(activeFolderId));
          };
        });
      }

      function renderTreeSelection(folderId) {
        document.querySelectorAll("[data-drop-folder]").forEach((item) => {
          item.classList.toggle("active", item.dataset.dropFolder === folderId);
        });
      }

      detailSection.addEventListener("click", (event) => {
        const summaryBtn = event.target.closest("[data-chat-summary]");
        if (!summaryBtn || !activeFileId || !fileDetails[activeFileId]) return;
        const detail = fileDetails[activeFileId];
        detail.chat.push({ role: "user", text: "总结一下" });
        detail.chat.push({
          role: "assistant",
          text: `总结一下：${detail.summary || "当前文档主要用于知识库沉淀与检索增强。"}`
        });
        renderFileDetail(detail);
      });

      document.querySelectorAll("[data-open-folder]").forEach((item) => {
        item.addEventListener("click", () => {
          renderFolderFiles(item.dataset.openFolder);
          renderTreeSelection(item.dataset.openFolder);
        });
      });

      document.querySelectorAll("[data-drop-folder]").forEach((item) => {
        item.addEventListener("click", () => {
          renderFolderFiles(item.dataset.dropFolder);
          renderTreeSelection(item.dataset.dropFolder);
        });
      });

      document.querySelectorAll("[data-drop-folder]").forEach((item) => {
        item.addEventListener("dragover", (event) => {
          event.preventDefault();
          item.classList.add("is-drop-target");
        });
        item.addEventListener("dragleave", () => {
          item.classList.remove("is-drop-target");
        });
        item.addEventListener("drop", (event) => {
          event.preventDefault();
          item.classList.remove("is-drop-target");
          const fileId = event.dataTransfer.getData("text/plain");
          const folderId = item.dataset.dropFolder;
          if (!fileId || !fileDetails[fileId]) return;
          fileDetails[fileId].folder = folderId;
          renderFileRows(getFilesByFolder(folderId));
          renderTreeSelection(folderId);
        });
      });

            <div></div>
            <div class="view-toggle">
              <button class="view-toggle-btn active" type="button" data-file-view="list">列表</button>
              <button class="view-toggle-btn" type="button" data-file-view="grid">图卡</button>
            </div>
          </div>
        `
      );

      filesSection.querySelectorAll("[data-file-view]").forEach((button) => {
        button.addEventListener("click", () => {
          activeFileView = button.dataset.fileView;
          filesSection.querySelectorAll("[data-file-view]").forEach((btn) => btn.classList.toggle("active", btn === button));
          renderFileRows(getFilesByFolder(activeFolderId));
        });
      });

      filesTitle.remove();
      bindFileRowEvents();
      renderTreeSelection("all");
      collapseNavBtn.addEventListener("click", () => {
        shell.classList.toggle("nav-collapsed");
        collapseNavBtn.textContent = shell.classList.contains("nav-collapsed") ? "▣" : "◫";
      });
      expandNavBtn.addEventListener("click", () => {
        shell.classList.toggle("nav-collapsed");
        collapseNavBtn.textContent = shell.classList.contains("nav-collapsed") ? "▣" : "◫";
      });

      backButton.addEventListener("click", resetView);
    </script>
  </body>
</html>
