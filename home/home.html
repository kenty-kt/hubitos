<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubitos Home</title>
    <link rel="stylesheet" href="../shared/sidebar.css" />
    <link rel="stylesheet" href="./home.css" />
    <link rel="stylesheet" href="../shared/theme-dark.css" />
  </head>
  <body>
    <div class="desktop-stage">
      <main class="app-window">
        <div id="sharedSidebar"></div>

        <section class="home-shell">
          <header class="home-topbar">
            <div>
              <div class="topbar-kicker">首页</div>
              <h1>欢迎回来，开始今天的 AI 工作</h1>
            </div>
          </header>

          <div class="home-grid">
            <section class="prompt-shell">
              <div class="prompt-composer">
                <textarea id="homePromptInput" rows="3" placeholder="例如：帮我把这个需求整理成 PRD，并给出首页结构草图"></textarea>
                <div class="prompt-actions">
                  <button class="prompt-send" id="startTaskBtn" type="button">开始任务</button>
                </div>
              </div>
            </section>

            <section class="signal-panel signal-panel-inline">
              <div class="panel-head">
                <span class="panel-kicker" id="systemTimeLabel"></span>
                <h3></h3>
              </div>
              <div class="signal-stack" id="signalStack"></div>
            </section>
          </div>

          <div class="content-grid">
            <section class="panel task-panel">
              <div class="panel-head split">
                <div>
                  <h3>自动任务</h3>
                </div>
                <a class="text-link" href="../chat/chat-workspace.html"></a>
              </div>
              <div class="task-list" id="taskList"></div>
            </section>

            <section class="panel workspace-panel">
              <div class="panel-head">
                <h3>智能体</h3>
              </div>
              <div class="workspace-list" id="workspaceList"></div>
            </section>
          </div>

          <section class="panel activity-panel">
            <div class="panel-head split">
              <div>
                <span class="panel-kicker">最近</span>
                <h3></h3>
              </div>
              <button class="ghost-pill subtle" id="refreshFeedBtn" type="button">刷新</button>
            </div>
            <div class="activity-list" id="activityList"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script>
      window.HubitosSidebar.mount("#sharedSidebar", {
        active: "home",
        homeHref: "./home.html",
        showHistory: true,
        historyTitle: "最近对话",
        primaryLabel: "+ 新建任务",
        primaryId: "newTaskBtn",
        chatHref: "../chat/chat-workspace.html",
        toolsHref: "../tools/tools-center.html",
        workflowsHref: "../workflows/workflows-home.html",
        projectsHref: "../projects/projects-center.html",
        filesHref: "../files/files-center.html",
        agentsHref: "../agents/agents-center.html",
        skillsHref: "../skills/skills-center.html",
        mcpHref: "../mcp/mcp-center.html"
      });
    </script>
    <script src="./home.js"></script>
  </body>
</html>
